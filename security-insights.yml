# OpenSSF Security Insights — https://security-insights.openssf.org
# Машиночитаемый отчёт о безопасности проекта. Волна ×13 (2026-11-10) создала
# файл по v1-структуре с заявкой schema 2.0.0; Волна ×18 (2026-11-10) переписала
# его по живой схеме v2.2.0 (текущий стандарт от 31.01.2026) с ревизией фактов
# живой пробой. Каждое утверждение = файл репо или живой API-факт. Проверка
# схемы — CI: .github/workflows/security-insights.yml (CUE v0.17.1).
header:
  schema-version: 2.2.0
  last-reviewed: "2026-11-10"
  last-updated: "2026-11-10"
  url: https://raw.githubusercontent.com/rtynbirf/polymath-os/main/security-insights.yml
  comment: |
    Ревизия ×18: утверждение файла ×13 «Immutable releases + release attestations»
    живой пробой НЕ подтвердилось (releases/latest → immutable: false). Волна ×18
    включила неизменяемость релизов живым PATCH (документированного REST-поля
    у репозитория нет — включено на каждый релиз) и переписала файл по правде.
repository:
  url: https://github.com/rtynbirf/polymath-os
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Полимат-Универсум (rtynbirf)
      affiliation: соло-флот с мультиагентным роем
      primary: true
  documentation:
    contributing-guide: https://github.com/rtynbirf/polymath-os/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/rtynbirf/polymath-os/blob/main/SECURITY.md
    governance: https://github.com/rtynbirf/polymath-os/blob/main/GOVERNANCE.md
  license:
    url: https://github.com/rtynbirf/polymath-os/blob/main/LICENSE
    expression: MIT
  release:
    automated-pipeline: true
    changelog: https://github.com/rtynbirf/polymath-os/blob/main/CHANGELOG.md
    distribution-points:
      - uri: https://github.com/rtynbirf/polymath-os/releases
        comment: GitHub Releases; релизы v3.25.0+ переведены в immutable живым PATCH (×18)
    attestations:
      - name: Release SBOM (CycloneDX 1.6)
        predicate-uri: https://cyclonedx.org/bom
        location: https://github.com/rtynbirf/polymath-os/releases/download/v{version}/sbom.cyclonedx.json
        comment: release.yml публикует SBOM каждого релиза; {version} заменить на тег
      - name: Build provenance (SLSA v1)
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://github.com/rtynbirf/polymath-os/attestations
        comment: GitHub Artifact Attestations; проверка gh attestation verify
  security:
    assessments:
      self:
        comment: |
          Самооценка по OSPS Baseline v2026.08.28 — 64 контроля, каждый с доказательством
          (файл репо / живой API-ответ / зелёный прогон): L1 22✅/2⚠️ · L2 19✅ · L3 9✅/9⚠️/1❌.
          ❌ = QA-07.01 апрув второго человека — честный соло-потолок, не код.
        evidence: https://github.com/rtynbirf/polymath-os/blob/main/OSPS-BASELINE-MATRIX.md
        date: "2026-11-10"
      third-party:
        - comment: OpenSSF Scorecard — живой замер api.scorecard.dev 7.5/10 (Волна ×17)
          evidence: https://scorecard.dev/viewer/?uri=github.com/rtynbirf/polymath-os
          date: "2026-11-10"
    tools:
      - name: CodeQL
        type: SAST
        rulesets: ["security-extended"]
        integration:
          adhoc: false
          ci: true
          release: true
        results:
          ci:
            name: CodeQL code scanning
            predicate-uri: https://intoto.SAST
            location: https://github.com/rtynbirf/polymath-os/security/code-scanning
      - name: gitleaks
        type: secret
        rulesets: ["default"]
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: gitleaks CI-джоба
            predicate-uri: https://intoto.SECRET
            location: https://github.com/rtynbirf/polymath-os/blob/main/.gitleaks.toml
      - name: Dependabot
        type: SCA
        rulesets: ["default"]
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          adhoc:
            name: Dependabot alerts
            predicate-uri: https://intoto.SCA
            location: https://github.com/rtynbirf/polymath-os/security/dependabot
      - name: OpenSSF Scorecard
        type: other
        rulesets: ["default"]
        integration:
          adhoc: false
          ci: true
          release: true
        results:
          ci:
            name: scorecard.yml — прогон на каждый push
            predicate-uri: https://intoto.SCORECARD
            location: https://scorecard.dev/viewer/?uri=github.com/rtynbirf/polymath-os
      - name: GitHub Artifact Attestations (SLSA Build L3)
        type: other
        rulesets: ["default"]
        integration:
          adhoc: false
          ci: false
          release: true
        results:
          release:
            name: attestations артефактов релиза
            predicate-uri: https://slsa.dev/provenance/v1
            location: https://github.com/rtynbirf/polymath-os/attestations
      - name: cosign keyless (Sigstore)
        type: other
        rulesets: ["default"]
        integration:
          adhoc: false
          ci: false
          release: true
        results:
          release:
            name: подписи релиза
            predicate-uri: https://slsa.dev/provenance/v1
            location: https://github.com/rtynbirf/polymath-os/releases
      - name: Immutable releases (GitHub)
        type: other
        rulesets: ["default"]
        integration:
          adhoc: false
          ci: false
          release: true
        results:
          release:
            name: "releases/latest → immutable true (вскрытие ×18, PATCH API)"
            predicate-uri: https://slsa.dev/provenance/v1
            location: https://api.github.com/repos/rtynbirf/polymath-os/releases/latest
