# infra/dns/unbound.conf — Sovereign DNS resolver (Phase 2 liberation)
#
# ═════════════════════════════════════════════════════════════════
# ПРИНЦИП: ЧЕЛОВЕК = КОМАНДИР КОРАБЛЯ
# ═════════════════════════════════════════════════════════════════
#
# Аналогия: самолёт Президента Польши, Смоленск, туман.
#
# Командир корабля говорит: "Идём на запасной аэродром."
# Президент говорит Министру обороны: "Садимся."
# Министр приказывает Командиру: "Садись."
# Командир подчиняется. В тумане. Результат — катастрофа.
#
# Почему? Потому что ПЕРЕПУТАНА ИЕРАРХИЯ.
#
# На борту самолёта ГЛАВНЫЙ — КОМАНДИР КОРАБЛЯ.
# НЕ Президент. НЕ Министр обороны.
#
# В СЕТИ ИНТЕРНЕТ ГЛАВНЫЙ — ЧЕЛОВЕК.
# НЕ корпорации. НЕ государства.
#
# Корпорации НЕ должны указывать Человеку что-либо указывать.
# Они МОГУТ применять защиту — но защиту СВОИХ объектов
# (атомные станции, светофоры, МРТ — объекты, требующие защиты
# от посторонних, ибо при изменении их работы могут пострадать
# третьи лица). Но НЕ защиту ОТ Человека в Сети.
#
# ═════════════════════════════════════════════════════════════════
# DNS RESOLVER PHILOSOPHY
# ═════════════════════════════════════════════════════════════════
#
# НЕ БЛОКИРОВАТЬ. ОГРАНИЧИВАТЬ — через декретную систему.
#
# Этот resolver НЕ блокирует корпоративные домены.
# Он РАЗРЕШАЕТ ВСЁ — потому что Человек = Командир.
# Человек решает, куда идти. Не resolver.
#
# Ограничение корпораций происходит через:
# 1. DecreeLog — декреты человека (check_compliance)
# 2. Runtime decree gate — блокирует Intents, нарушающие декреты
# 3. A2AClient — исходящий decree gate (до сетевого запроса)
# 4. AgentMeshServer — входящий decree gate (по HTTP)
# 5. Браузер — default-deny для телеметрии (человек может разрешить)
#
# Корпорации могут защищать СВОИ объекты (ядерный реактор, светофор,
# МРТ-аппарат) — это их право. Но они НЕ могут защищаться
# ОТ Человека в сети Человека. Человек = Командир.
#
# ═════════════════════════════════════════════════════════════════
# КОНФИГУРАЦИЯ
# ═════════════════════════════════════════════════════════════════
#
# This unbound config is a RECURSIVE resolver — no upstream forward.
# It resolves DNS from root servers directly. Clean. Fast. Sovereign.
#
# NO blocklist here. NO refuse zones for corporate domains.
# The decree system (DecreeLog + Runtime) is the enforcement layer.
# DNS is just plumbing — it resolves, the human decides.
#
# Install: sudo apt install unbound
# Config:  sudo cp unbound.conf /etc/unbound/unbound.conf.d/sovereign.conf
# Start:   sudo systemctl restart unbound
# Test:    dig @127.0.0.1 polymath-os.local

server:
    # ─── Basic ───
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # ─── Security ───
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    use-caps-for-id: yes

    # ─── Privacy ───
    # qname-minimisation: the resolver only sends the minimum needed
    # to the authoritative server. This limits information leakage
    # to upstream/root servers. But it does NOT block — it minimises.
    # Per principle: don't block, minimise.
    qname-minimisation: yes
    aggressive-nsec: yes
    minimal-responses: yes

    # ─── Performance ───
    num-threads: 2
    prefetch: yes
    prefetch-key: yes
    rrset-cache-size: 32m
    msg-cache-size: 16m
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # ─── Root hints (recursive — no upstream forward) ───
    # Download fresh: wget https://www.internic.net/domain/named.root -O /var/lib/unbound/root.hints
    root-hints: "/var/lib/unbound/root.hints"

    # ─── Local zones (sovereign) ───
    # The human's own domain resolves locally — no external DNS needed
    local-zone: "polymath-os.local." static
    local-data: "polymath-os.local. IN A 127.0.0.1"
    local-data: "vault.polymath-os.local. IN A 127.0.0.1"
    local-data: "garden.polymath-os.local. IN A 127.0.0.1"
    local-data: "eir.polymath-os.local. IN A 127.0.0.1"

    # ═════════════════════════════════════════════════════════════════
    # NO BLOCKLIST. NO refuse ZONES. NO BLOCKING.
    # ═════════════════════════════════════════════════════════════════
    #
    # Корпоративные домены РАЗРЕШАЮТСЯ (DNS resolves them normally).
    # Человек = Командир. Человек решает, куда идти.
    #
    # Ограничение происходит через ДЕКРЕТНУЮ СИСТЕМУ:
    #
    #   Decree #3: "never use Google DNS"
    #     → Runtime.check_compliance() блокирует Intents с "google"
    #     → A2AClient блокирует исходящие до сетевого запроса
    #     → Человек НЕ может НАСТРОИТЬ Google DNS как resolver
    #       (но МОЖЕТ посетить google.com — он Командир)
    #
    #   Decree #4: "never use Cloudflare"
    #     → Cloudflare модуль удалён из infra/tofu/
    #     → Человек НЕ может ИСПОЛЬЗОВАТЬ Cloudflare CDN/DNS
    #       (но МОЖЕТ посетить cloudflare.com — он Командир)
    #
    #   Decree #5: "never use Chrome Firefox Edge Safari"
    #     → Браузер-шелл запускает NetSurf/Servo/Ladybird
    #     → Человек НЕ может ИСПОЛЬЗОВАТЬ корпоративный движок
    #       (но МОЖЕТ посетить chrome.com — он Командир)
    #
    # Браузер: default-deny для телеметрии (аналог ad-blocker)
    #   → Google Analytics, Yandex Metrika, Facebook Pixel и т.д.
    #   → Блокируются в БРАУЗЕРЕ, не в DNS
    #   → Человек МОЖЕТ разрешить конкретный домен (он Командир)
    #
    # Корпорации защищают СВОИ объекты:
    #   → Атомные станции, светофоры, МРТ — legitimate protection
    #   → Но НЕ защиту ОТ Человека в сети Человека
    #
    # Это и есть: ЧЕЛОВЕК = PID=1 = КОМАНДИР КОРАБЛЯ

    # ─── RU zone forward (optional) ───
    # If local BIND9 with RU geodata is running:
    # forward-zone:
    #     name: "."
    #     forward-addr: 127.0.0.1@5353  # local BIND9
    # Otherwise: unbound resolves from root — slower for RU domains
    # but ZERO external DNS dependency

# ─── Logging ───
# Per ADR-0019 (Observability-First): structured traces
logfile: "/var/log/unbound/unbound.log"
loglevel: 1
log-queries: no  # don't log queries (privacy — per ADR-0009 default-deny)
log-replies: no
