# infra/dns/unbound.conf — Sovereign DNS resolver (Phase 2 liberation)
#
# Per LIBERATION_ROADMAP.md: eliminate Google DNS (8.8.8.8),
# Cloudflare DNS (1.1.1.1), Yandex DNS (77.88.8.8), Quad9 (9.9.9.9).
#
# This unbound config is a RECURSIVE resolver — no upstream forward.
# It resolves DNS from root servers directly. No Google. No Cloudflare.
# No Yandex. No Quad9. No "good uncle" DNS provider.
#
# RU zone is forwarded to a local BIND9 instance with RU geodata
# (optional — if not running BIND9, RU domains resolve from root too).
#
# Install: sudo apt install unbound
# Config:  sudo cp unbound.conf /etc/unbound/unbound.conf.d/sovereign.conf
# Start:   sudo systemctl restart unbound
# Test:    dig @127.0.0.1 google.com
#          (should resolve WITHOUT going through 8.8.8.8 or 1.1.1.1)

server:
    # ─── Basic ───
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    
    # ─── Security ───
    # Block corporate DNS providers — never forward to them
    # Per ADR-0002 Tier 2: replaceable by local resolver
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    use-caps-for-id: yes
    
    # ─── Privacy ───
    # Don't send DNSSEC queries to "fake" data providers
    qname-minimisation: yes
    aggressive-nsec: yes
    minimal-responses: yes
    
    # ─── Performance ───
    num-threads: 2
    prefetch: yes
    prefetch-key: yes
    rrset-cache-size: 32m
    msg-cache-size: 16m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    
    # ─── Root hints (recursive — no upstream forward) ───
    # Download fresh: wget https://www.internic.net/domain/named.root -O /var/lib/unbound/root.hints
    root-hints: "/var/lib/unbound/root.hints"
    
    # ─── Local zones (sovereign) ───
    # The human's own domain resolves locally — no external DNS needed
    local-zone: "polymath-os.local." static
    local-data: "polymath-os.local. IN A 127.0.0.1"
    local-data: "vault.polymath-os.local. IN A 127.0.0.1"
    local-data: "garden.polymath-os.local. IN A 127.0.0.1"
    local-data: "eir.polymath-os.local. IN A 127.0.0.1"
    
    # ─── RU zone forward (optional) ───
    # If local BIND9 with RU geodata is running:
    # forward-zone:
    #     name: "."
    #     forward-addr: 127.0.0.1@5353  # local BIND9
    # Otherwise: unbound resolves from root — slower for RU domains
    # but ZERO external DNS dependency
    
    # ─── Block telemetry ───
    # Per LIBERATION_ROADMAP Phase 1: Tier 3 eliminated
    local-zone: "google-analytics.com." refuse
    local-zone: "googletagmanager.com." refuse
    local-zone: "doubleclick.net." refuse
    local-zone: "facebook.com." refuse
    local-zone: "amazon-adsystem.com." refuse
    
    # ─── Block corporate DNS ───
    # Per LIBERATION_ROADMAP Phase 2: never use these
    # (documented here as refuse zones — if somehow queried, refused)
    local-zone: "dns.google." refuse
    local-zone: "cloudflare-dns.com." refuse
    local-zone: "dns.yandex.ru." refuse
    local-zone: "dns.quad9.net." refuse

# ─── Logging ───
# Log to syslog — review with: journalctl -u unbound
# Per ADR-0019 (Observability-First): structured traces
logfile: "/var/log/unbound/unbound.log"
loglevel: 1
log-queries: no  # don't log queries (privacy — per ADR-0009 default-deny)
log-replies: no
