# infra/tofu/environments/personal/secrets.sops.yaml
#
# Example SOPS+age encrypted secrets file for the personal environment.
# Real secrets (Hetzner token, Cloudflare API token, SSH private key)
# are encrypted with age (X25519 + ChaCha20-Poly1305, Tier 1 sovereign crypto).
#
# The age PRIVATE key is NOT in git (per ADR-0002 §Tier 1). It is fetched
# from 1Password CLI at bootstrap:
#
#     op item get "polymath-infra-age-identity" --field identity \
#       > ~/.config/sops/age/keys.txt && chmod 600 ~/.config/sops/age/keys.txt
#
# To regenerate this file (after replacing .sops.yaml age key with real one):
#
#     sops environments/personal/secrets.sops.yaml
#     # editor opens → set values → save → file is re-encrypted
#
# To decrypt at apply time:
#
#     sops -d environments/personal/secrets.sops.yaml > /tmp/secrets.yaml
#     tofu apply -var-file=/tmp/secrets.yaml
#     shred /tmp/secrets.yaml
#
# This file is committed in its ENCRYPTED form. The values below are
# PLACEHOLDER encrypted blobs — they will NOT decrypt into anything valid.
# To make this environment functional, you MUST:
#   1. Generate your own age identity: `age-keygen -o keys.txt`
#   2. Replace the `age:` recipient in .sops.yaml with your public key
#   3. Re-encrypt with `sops secrets.sops.yaml` and fill in real values.

hetzner_token: ENC[AES256_GCM,data:UE9MWU1BVEgtUExBQ0VIT0xERVI=,iv:UE9MWU1BVEgtUExBQ0VIT0FEQ0U=,tag:UE9MWU1BVEgtUExBQ0VIT0FEQUw=,type:str]
hetzner_dns_token: ENC[AES256_GCM,data:UE9MWU1BVEgtRE5TLVBMQUNFSE9MREVS,iv:UE9MWU1BVEgtRE5TLVBMQUNFUk1BVA==,tag:UE9MWU1BVEgtRE5TLVBMQUNFRUEw,type:str]
# cloudflare removed per decree #4 (never use Cloudflare)
ssh_public_key_primary: ENC[AES256_GCM,data:c3NoLWVkMjU1MTkgQUFBQUMzTnllQTB6NTRBUGxBS3k1UjRKcFBBUGtQQXk9IHBvbHltYXRoQGhvc3Q=,iv:UE9MWU1BVEgtU1NILVBVQkxJQ0tFWQ==,tag:UE9MWU1BVEgtU1NILVBVQkxJRUFX,type:str]

