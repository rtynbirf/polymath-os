# .github/workflows/publish-garden.yml — Garden publish (zero-dep, no Quartz)
#
# Per LIBERATION_ROADMAP: eliminate corporate CDN + external deps.
# Previous version used Quartz v4 (required @jackyzhao/quartz git repo
# which was unreachable from GHA runner — garden never went live).
#
# This version uses build_simple.sh — zero npm, zero CDN, zero Quartz.
# Markdown → HTML via awk. Canary negative test (ADR-0009).
#
# Result: https://rtynbirf.github.io/polymath-os/ — LIVE garden.

name: publish-garden

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'apps/garden/scripts/build_simple.sh'
      - '.github/workflows/publish-garden.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-garden
  cancel-in-progress: false

jobs:
  build:
    name: Build garden (zero-dep) + deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Filter vault (default-deny per ADR-0009)
        run: |
          python3 apps/garden/scripts/filter_vault.py \
            --vault vault/60-permanent \
            --out apps/garden/content \
            --canary-marker __CANARY_p1m0s_8f3a2e91_dnp_v1__ \
            --canary-path vault/90-meta/canary-secret.md

      - name: Security scan — canary negative test
        run: |
          if grep -r "__CANARY_p1m0s_8f3a2e91_dnp_v1__" apps/garden/content/; then
            echo "⛔ CANARY LEAKED — deploy blocked"
            exit 1
          fi
          echo "✓ canary not in published content"

      - name: Build garden HTML (zero-dep, no Quartz)
        run: |
          bash apps/garden/scripts/build_simple.sh \
            vault/60-permanent apps/garden/content \
            __CANARY_p1m0s_8f3a2e91_dnp_v1__ vault/90-meta/canary-secret.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/garden/content

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
