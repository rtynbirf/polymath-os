# .github/workflows/ci.yml — Polymath OS
# Verifiable open-source contract: every PR runs `make verify`

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    name: make verify (open-source contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Run verify (12 verifiable claims)
        run: make verify

  ci:
    permissions:
      contents: read
      id-token: write
    name: lint + typecheck + test + build + security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        # version is read from package.json packageManager field
        # (currently pnpm@9.15.9 — matches pnpm-lock.yaml)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test (SINGULYAR EIR + MCP suites)
        run: |
          cd runtime && python3 scripts/check.py
          cd ..
          PYTHONPATH=. python3 -m tooling.agents.mcp verify --coverage

      - name: Build (Quartz v4 in apps/garden)
        # Quartz v4 requires one-time bootstrap to populate apps/garden/quartz/
        # In CI we bootstrap + build to validate; full Pages deploy is in
        # publish-garden.yml (separate workflow). If Quartz bootstrap fails
        # (e.g. upstream git repo temporarily unavailable), do NOT fail CI —
        # the runtime/MCP tests above are the open-source contract.
        continue-on-error: true
        working-directory: apps/garden
        run: |
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --no-frozen-lockfile
          pnpm run quartz bootstrap || npx @jackyzha0/quartz bootstrap
          pnpm run build

      # Security scans
      - name: Run Semgrep (community CLI)
        # Экшен returntocorp/semgrep-action устарел (последний релиз 2024-01, v1 пин 2023-11),
        # semgrep/semgrep-action архивирован — актуальный путь: официальный CLI.
        run: |
          python3 -m pip install --quiet --require-hashes -r scripts/requirements/semgrep.txt
          semgrep scan --config auto --metrics=off
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
        continue-on-error: true

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Supply chain: SBOM
      # cyclonedx-pnpm is the pnpm-native SBOM tool. If unavailable
      # or the registry is unreachable, do NOT fail CI — SBOM is
      # generated in release.yml with cosign-signed blob + SLSA L2 attestation.
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          pnpm dlx @cyclonedx/cyclonedx-pnpm --output-file sbom.json || \
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json || \
          echo "SBOM generation skipped — see release.yml for signed SBOM on release"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom.json
