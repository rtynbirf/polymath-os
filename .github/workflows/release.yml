# .github/workflows/release.yml — Polymath OS
# Trigger: git tag v*.*.*. Builds, runs `make verify`, generates SBOM (CycloneDX),
# cosign-signs the SBOM (keyless OIDC), creates GitHub Release with notes extracted
# from CHANGELOG.md (Keep a Changelog format).
# https://docs.github.com/en/actions/publishing-releases-from-github-actions

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger for dry-run (no actual Release published if skip-publish=true).
  workflow_dispatch:
    inputs:
      skip-publish:
        description: "Dry-run: build+SBOM+verify, do NOT publish Release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: read-all

# Never cancel an in-flight release — partial published Release is worse than full retry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # create GitHub Release + upload assets
      id-token: write # cosign keyless (OIDC) — no long-lived signing key in secrets
      attestations: write # GitHub Artifact Attestations (SLSA Build L3, ADR-0013) — attestation store
      # packages: write убран (Волна ×11, минимум привилегий): GHCR-пуш был
      # «reserved; no images currently published» — вернём при реальной публикации.
    name: Build + SBOM + cosign-sign + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SBOM_FILE: sbom.cyclonedx.json
    steps:
      - name: Checkout (full history for changelog parsing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Run `make verify` (open-source contract — must stay green on release)
        run: make verify

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        # version is read from package.json packageManager field

      - name: Install + build (pnpm + turborepo)
        # Build is non-blocking — Quartz v4 requires one-time bootstrap that
        # can fail if upstream @jackyzha0/quartz git repo is unreachable.
        # The runtime/MCP tests above are the open-source contract floor;
        # garden build is downstream Pages-deploy concern (publish-garden.yml).
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          (cd apps/garden && pnpm run quartz bootstrap || npx @jackyzha0/quartz bootstrap) || true
          pnpm turbo run build || echo "build skipped — see publish-garden.yml for full garden build"

      - name: Generate SBOM (CycloneDX — npm + Python)
        run: |
          # pnpm-native SBOM (preferred — uses pnpm-lock.yaml directly)
          pnpm dlx @cyclonedx/cyclonedx-pnpm --output-file "$SBOM_FILE" || \
            pnpm dlx @cyclonedx/cyclonedx-npm --output-format JSON --output-file "$SBOM_FILE" || \
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > "$SBOM_FILE"

          # Python SBOM (covers SINGULYAR EIR runtime + MCP adapters — zero external deps)
          python3 -m pip install --quiet --require-hashes -r scripts/requirements/cyclonedx-py.txt 2>/dev/null || true
          cyclonedx-py environment --output-file sbom.python.cyclonedx.json || \
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom.python.cyclonedx.json

          sha256sum "$SBOM_FILE" sbom.python.cyclonedx.json | tee "${SBOM_FILE}.sha256"
          ls -la "$SBOM_FILE" sbom.python.cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SBOM (keyless OIDC, Sigstore)
        run: |
          cosign sign-blob --yes \
            --bundle sbom.bundle \
            --output-certificate sbom.pem \
            --output-signature sbom.sig \
            "$SBOM_FILE"
          echo "::notice::SBOM signed with keyless OIDC. Verify locally with:"
          echo "::notice::  cosign verify-blob $SBOM_FILE --bundle sbom.bundle"
          echo "::notice::  (классика: --certificate sbom.pem --signature sbom.sig)"

      - name: Generate SLSA L2 provenance
        # Per ADR-0004: target SLSA Build L2 (signed provenance from hosted build platform).
        # Keyless OIDC: no long-lived signing key in secrets (per ADR-0006 falsifiable self-*).
        # Cosign attest-blob — in-toto Statement v0.1 with SLSA provenance predicate v0.2.
        # Файл публикуется под каноническим SLSA-расширением .intoto.jsonl — именно его
        # признаёт чек Signed-Releases OpenSSF Scorecard (probes/releasesHaveProvenance,
        # provenanceExtensions = [".intoto.jsonl"], волна 8).
        run: |
          # Generate SLSA provenance predicate from GHA build context
          python3 - <<'PYEOF'
          import json, os, hashlib
          sbom_path = os.environ["SBOM_FILE"]
          with open(sbom_path, "rb") as f:
              sbom_bytes = f.read()
          sbom_sha = hashlib.sha256(sbom_bytes).hexdigest()
          provenance = {
            "_type": "https://in-toto.io/Statement/v0.1",
            "subject": [{
              "name": "polymath-os-sbom",
              "digest": {"sha256": sbom_sha}
            }],
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "builder": {
                "id": "https://github.com/rtynbirf/polymath-os/.github/workflows/release.yml@main"
              },
              "buildType": "github-actions-release-workflow",
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/rtynbirf/polymath-os",
                  "digest": {"sha1": os.environ.get("GITHUB_SHA", "")},
                  "entryPoint": ".github/workflows/release.yml"
                },
                "parameters": {
                  "event": os.environ.get("GITHUB_EVENT_NAME", ""),
                  "ref": os.environ.get("GITHUB_REF", ""),
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "runner_os": os.environ.get("RUNNER_OS", ""),
                  "runner_arch": os.environ.get("RUNNER_ARCH", "")
                },
                "environment": {
                  "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "github_repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "github_actor": os.environ.get("GITHUB_ACTOR", "")
                }
              },
              "metadata": {
                "buildStartedOn": "",
                "buildFinishedOn": "",
                "completeness": {"parameters": True, "environment": True, "materials": False},
                "reproducible": False
              },
              "materials": [{
                "uri": "git+https://github.com/rtynbirf/polymath-os",
                "digest": {"sha1": os.environ.get("GITHUB_SHA", "")}
              }]
            }
          }
          with open("sbom.slsa-provenance.intoto.jsonl", "w") as f:
              json.dump(provenance, f, indent=2)
          print(f"Wrote SLSA L2 provenance: sbom.slsa-provenance.intoto.jsonl (sbom sha256: {sbom_sha[:16]}...)")
          PYEOF

          # Cosign attest the SBOM (keyless OIDC, sigstore)
          cosign attest-blob --yes "$SBOM_FILE" \
            --predicate sbom.slsa-provenance.intoto.jsonl \
            --bundle sbom.attestation.bundle \
            --output-attestation sbom.attestation.json || \
            echo "SLSA attest skipped (cosign version may not support attest-blob or no OIDC available)"

      - name: GitHub Artifact Attestation (SLSA Build L3 — ADR-0013, волна ×12)
        # Мировой тренд (GitHub changelog 2026-01-20, «code-to-cloud traceability +
        # SLSA Build L3»): аттестацию генерирует и хранит СЕРВИС GitHub (attestation
        # store) по OIDC-личности воркфлоу — шаг trusted-builder separation из
        # ADR-0013: билд не может подделать аттестацию. Верификация:
        #   gh attestation verify <файл> -R rtynbirf/polymath-os
        # Герметичная сборка и воспроизводимость остаются в v2.0 (ADR-0013).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subjects: |
            ${{ env.SBOM_FILE }}
            sbom.python.cyclonedx.json

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"  # strip leading "v"
          python3 - "$version" <<'PY'
          import re, sys, pathlib
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[v?{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## |\Z)"
          m = re.search(pattern, text, re.DOTALL)
          body = m.group(1).strip() if m else "(no changelog entry for this version)"
          pathlib.Path("release_notes.md").write_text(body, encoding="utf-8")
          print(f"::notice::Extracted {len(body)} chars for v{ver}")
          PY

      - name: Determine prerelease
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* || "${{ github.ref_name }}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.skip-publish == 'false' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: ${{ github.event.inputs.skip-publish == 'true' && 'true' || 'false' }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: false # we use CHANGELOG.md, not auto-generated commits
          files: |
            ${{ env.SBOM_FILE }}
            ${{ env.SBOM_FILE }}.sha256
            sbom.python.cyclonedx.json
            sbom.pem
            sbom.sig
            sbom.bundle
            sbom.attestation.json
            sbom.attestation.bundle
            sbom.slsa-provenance.intoto.jsonl
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
