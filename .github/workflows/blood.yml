# Кровь: пульс клетки polymath-os. Запуск — ТОЛЬКО событие
# (repository_dispatch от предыдущей клетки), не таймер (закон 1: угадчик — яд).
# Клетка сверяет конверт со своим живым github.sha, дописывает эхо в летопись роя
# (cell-swarm/blood/CELLS-LEDGER.jsonl — клеточная летопись цепи) и передаёт
# кровь следующей клетке цепи — cell-rs. Ядро крови продано из runtime-protocol@0d98019
# (tooling/blood/kernel/, провенанс и sha256 — рядом).
#
# Волна ×9 «рой из модели в кровь» (2026-11-09): polymath-os перестаёт быть
# концом цепи — кровь течёт дальше в первую Rust-клетку (cell-rs), где конверт
# сверяется ВТОРЫМ ЯЗЫКОМ (Rust-тропа), затем — в voice-atlas-llm (конец пульса).
name: blood

permissions:
  contents: read

on:
  repository_dispatch:
    types: [blood-pulse]
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: кровь — сверка конверта, эхо в летопись, сборка тела для cell-rs
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          BLOOD_ENVELOPE: ${{ toJson(github.event.client_payload.envelope) }}
          CELL_NAME: polymath-os
          CELL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: python3 tooling/blood/kernel/blood_cell.py --next-repo rtynbirf/cell-rs --next-output /tmp/next_dispatch.json

      - name: ручной прогон — сверка летописи живьём (кровь вслепую не льётся)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CELL_NAME: polymath-os
          CELL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: python3 tooling/blood/kernel/blood_cell.py --manual-check

      - name: кровь идёт дальше — dispatch → cell-rs (Rust-клетка)
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: |
          if [ ! -s /tmp/next_dispatch.json ]; then
            echo "dispatch-тело не собрано (этап эха не прошёл) — цепь остановлена честно"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/next.json -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rtynbirf/cell-rs/dispatches \
            -d @/tmp/next_dispatch.json) || CODE=000
          echo "ФАКТ: dispatch cell-rs: HTTP $CODE (204=кровь потекла в Rust-клетку)"
          [ "$CODE" = "204" ] || { cat /tmp/next.json; exit 1; }
