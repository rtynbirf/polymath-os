name: wave3-dora
on:
  schedule:
    # Квартальный дайджест (ПРЕДЛОЖЕНИЕ-17): 1-е числа января, апреля, июля, октября
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:

# Минимум привилегий (Волна ×11): пуш живых чисел под rulesets всё равно отклоняется
# (GH013) — числа закрепляются в GITHUB_STEP_SUMMARY (fallback в шаге ниже); write
# здесь никогда не нужен. GITHUB_TOKEN ниже используется только на чтение API.
permissions: read-all

jobs:
  two-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: DORA-дайджест роя (16 чисел — 4 метрики x 4 флагмана, из GitHub API)
        run: python3 wave3/two_numbers.py dora
        env:
          # Живые числа вместо HTTPError: без токена api.github.com из runner'а
          # ловит вторичный rate-limit (403) — все 16 ячеек становятся «нет данных».
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Свобода-счёт — колонка freedom в описи == выводу check_freedom.py (репорт-режим)
        run: |
          python3 wave3/two_numbers.py freedom || echo "🟡 находка: вывод check_freedom.py не распознан — расхождение зафиксировано в логе (issue polymath-os#34); шаг в репорт-режиме"

      - name: Закрепить живые числа волны
        if: ${{ always() }} # отчёты закрепляются и красными — расхождение свободы это факт
        run: |
          if [ -n "$(git status --porcelain wave3)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add wave3
            git commit -m "wave3: живые числа — DORA-дайджест и свобода-отчёт"
            git pull --rebase origin main || true
            git push || { echo "🟡 пуш отклонён (rulesets/гонка) — живые числа закреплены в summary прогона"; [ -f wave3/DORA-дайджест.md ] && cat wave3/DORA-дайджест.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true; exit 0; }
          else
            echo "числа без изменений"
          fi
